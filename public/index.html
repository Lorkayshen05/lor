<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Game Mode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar">
  <a class="brand" href="#"><span class="glyph">EG</span><span class="brand-text">English Game <em>Mode</em></span></a>
  <div class="chips">
    <div class="chip"><span class="chip-k">Level</span><span class="chip-v" id="level">1</span></div>
    <div class="chip"><span class="chip-k">XP</span><span class="chip-v" id="xp">0</span></div>
    <div class="chip"><span class="chip-k">Streak</span><span class="chip-v" id="streak">0</span><span class="flame">🔥</span></div>
    <div class="chip clock"><span class="chip-k">Session</span><span class="chip-v" id="miniTimer">25:00</span></div>
  </div>
</header>

<main class="shell">
  <section class="stage">
    <nav class="rail" id="modes" aria-label="Practice modes"></nav>

    <article class="stagecard" id="stagecard">
      <div class="stagecard-head">
        <span class="pill" id="badge">Speaking</span>
        <span class="steps" id="count">1 / 1</span>
      </div>

      <p class="question" id="question">Loading…</p>
      <p class="hint" id="hint"></p>

      <div class="field">
        <textarea id="answer" placeholder="Write your answer in English…" spellcheck="true"></textarea>
        <div class="field-foot">
          <span id="wordcount">0 words</span>
          <span class="kbd">Ctrl + Enter to submit</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn solid" id="submit"><span>Submit</span><em id="xpHint">+XP</em></button>
        <button class="btn soft" id="hear">🔊<span>Hear</span></button>
        <button class="btn soft" id="voice">🎙️<span>Voice</span></button>
        <button class="btn line" id="next"><span>Next</span>→</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </article>
  </section>

  <aside class="panel">
    <div class="ringcard">
      <div class="ringwrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" cx="60" cy="60" r="52" id="ringFg"></circle>
        </svg>
        <div class="ring-mid"><b id="xp2">0</b><small>XP</small></div>
      </div>
      <div class="ringcard-foot">
        <span id="levelText">Level 1</span>
        <span id="goal">0 / 100</span>
      </div>
    </div>

    <div class="tiles">
      <div class="tile weak"><span class="tile-k">Weakness</span><p id="weakness">Not enough data yet.</p></div>
      <div class="tile good"><span class="tile-k">Improvement</span><p id="improvement">Keep practicing!</p></div>
      <div class="tile focus"><span class="tile-k">Next focus</span><p id="focus">Try all six modes today.</p></div>
    </div>

    <div class="timercard">
      <div class="timer-head"><span class="tile-k">Daily training</span><b class="timer" id="timer">25:00</b></div>
      <div class="track"><i id="timeFill"></i></div>
      <div class="timer-actions">
        <button class="btn solid sm" id="start">Start</button>
        <button class="btn line sm" id="reset">Reset</button>
      </div>
    </div>

    <div class="statusline">
      <span class="dot" id="dot"></span><span id="conn">Checking…</span>
      <button class="linkbtn" id="resetAll">Reset all</button>
    </div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
