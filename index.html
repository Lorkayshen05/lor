<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Game Mode 🎮</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 class="logo">English Game Mode <span>🎮</span></h1>
  <div class="stats">
    <div class="stat"><span class="label">Level</span><b id="hdrLevel">1</b></div>
    <div class="stat"><span class="label">XP</span><b id="hdrXp">0</b></div>
    <div class="stat"><span class="label">Streak</span><b id="hdrStreak">0🔥</b></div>
    <div class="stat"><span class="label">Timer</span><b id="hdrTimer">25:00</b></div>
  </div>
</header>

<main class="layout">
  <section class="play">
    <nav class="modes" id="modeBar"></nav>

    <div class="card" id="card">
      <div class="card-top">
        <span class="badge" id="modeBadge">Speaking</span>
        <span class="badge ghost" id="qCount">1 / 1</span>
      </div>
      <p class="prompt" id="promptText">Press a mode to start.</p>
      <p class="hint" id="hintText"></p>
      <textarea id="answerBox" class="answer" rows="4" placeholder="Type your answer in English..."></textarea>
      <div class="actions">
        <button class="btn primary" id="btnSubmit">Submit</button>
        <button class="btn" id="btnHear">🔊 Hear</button>
        <button class="btn" id="btnVoice">🎤 Voice</button>
        <button class="btn" id="btnNext">Next ▶</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <aside class="side">
    <h2>Progress</h2>
    <div class="side-block">
      <div class="row"><span>Level <b id="sideLevel">1</b></span><span id="sideXpText">0 / 100 XP</span></div>
      <div class="bar"><div class="fill" id="xpFill"></div></div>
    </div>
    <div class="side-block">
      <h3>Weakness</h3><p id="weakness">Not enough data yet.</p>
    </div>
    <div class="side-block">
      <h3>Improvement</h3><p id="improvement">Keep practicing!</p>
    </div>
    <div class="side-block">
      <h3>Next focus</h3><p id="nextFocus">Try all six modes today.</p>
    </div>
    <div class="side-block">
      <h3>Daily 25 min</h3>
      <div class="bar"><div class="fill green" id="timeFill"></div></div>
      <div class="timer-actions">
        <button class="btn small" id="btnTimer">Pause</button>
        <button class="btn small" id="btnResetDay">Reset day</button>
      </div>
    </div>
    <button class="btn small danger" id="btnResetAll">Reset all progress</button>
  </aside>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
